[package]
name = "ethercat-workbench-desktop"
version = "0.1.0"
description = "EtherCAT Workbench Tauri desktop host"
authors = ["EtherCAT Workbench contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
